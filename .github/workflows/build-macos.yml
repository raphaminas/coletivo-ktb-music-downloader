name: Build macOS DMG Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview pillow

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Download macOS static FFmpeg binaries
        run: |
          mkdir -p macos/bin
          curl -sL "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip" -o ffmpeg.zip
          unzip -q -o ffmpeg.zip -d macos/bin/
          curl -sL "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip" -o ffprobe.zip
          unzip -q -o ffprobe.zip -d macos/bin/
          chmod +x macos/bin/ffmpeg macos/bin/ffprobe
          rm -f ffmpeg.zip ffprobe.zip
          test -f macos/bin/ffmpeg
          test -f macos/bin/ffprobe

      - name: Package with PyInstaller
        run: |
          pyinstaller --clean -y macos/dj-downloader.spec

      - name: Ad-hoc code sign .app
        run: |
          codesign --force --deep --sign - "dist/DJ Downloader.app"

      - name: Create DMG Disk Image
        run: |
          mkdir -p dist-installer
          mkdir -p /tmp/dmg_staging
          cp -R "dist/DJ Downloader.app" /tmp/dmg_staging/
          ln -s /Applications /tmp/dmg_staging/Applications
          hdiutil create -volname "DJ Downloader" -srcfolder /tmp/dmg_staging -ov -format UDZO dist-installer/DJ-Downloader-macOS.dmg
          rm -rf /tmp/dmg_staging

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Downloader-macOS-DMG
          path: dist-installer/*.dmg
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
