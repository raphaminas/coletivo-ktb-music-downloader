name: Build Windows 11 Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview pillow

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Download Windows FFmpeg binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows/bin
          $zipUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp -Force
          $ffmpegDir = Get-ChildItem -Path ffmpeg_temp -Directory | Select-Object -First 1
          Copy-Item "$($ffmpegDir.FullName)/bin/ffmpeg.exe" -Destination windows/bin/ -Force
          Copy-Item "$($ffmpegDir.FullName)/bin/ffprobe.exe" -Destination windows/bin/ -Force
          Remove-Item -Recurse -Force ffmpeg_temp
          Remove-Item -Force ffmpeg.zip
          Test-Path windows/bin/ffmpeg.exe
          Test-Path windows/bin/ffprobe.exe

      - name: Package with PyInstaller
        run: |
          pyinstaller --clean -y windows/dj-downloader.spec

      - name: Compile Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Downloader-Windows-Installer
          path: dist-installer/*.exe
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
